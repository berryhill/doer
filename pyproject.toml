[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doer-loop"
version = "0.1.0"
description = "Bounded one-task agent loop with typed decisions and independent verification"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "laya==0.3.20",
  "torch==2.4.1+cpu",
  "transformers==4.48.3",
  "safetensors==0.5.3",
  "huggingface-hub==0.26.5",
  "numpy==2.0.2",
]

[project.scripts]
doer = "doer_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
