[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doer-loop"
version = "0.1.0"
description = "Bounded one-task agent loop with typed decisions and independent verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["laya>=0.3.20"]

[project.scripts]
doer = "doer_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
